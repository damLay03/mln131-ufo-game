<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFO xâm lăng – Ôn tập Nhóm 6</title>
<style>
:root{--sky1:#070b22;--sky2:#1d2460;--ok:#3ddc84;--bad:#ff5a6e;--ink:#eef2ff;--muted:#9aa3c7;--card:#11163a;--lime:#e8ff8a;--s:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--sky1);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font-family:inherit}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 120%,#3a3f8f 0%,var(--sky2) 40%,var(--sky1) 80%);transition:background 1.5s}
#stage.doom{background:radial-gradient(ellipse at 50% 120%,#b3132e 0%,#520b20 42%,#16030b 82%)}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.12}}

/* ===== bối cảnh sân trường ===== */
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#bg .win{fill:#1b2252}
#bg .win.lit{fill:#ffd77a}
#bg .win.flick{animation:flick2 3.2s infinite}
@keyframes flick2{0%,40%,44%,100%{fill:#ffd77a}42%{fill:#1b2252}}
#bg .moon{filter:drop-shadow(0 0 28px rgba(255,240,190,.75))}
#bg .flag{transform-box:fill-box;transform-origin:left center;animation:flag 1.6s ease-in-out infinite alternate}
@keyframes flag{to{transform:skewY(4deg) scaleX(.94)}}
.doom #bg .win.lit{fill:#ff7a7a}
.doom #bg .moon{fill:#ff9a9a}

/* ===== HUD ===== */
#hud{position:absolute;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;z-index:20}
.score{display:flex;gap:12px;font-size:20px;font-weight:700}
.pill{padding:7px 14px;border-radius:999px;background:rgba(10,14,40,.55);white-space:nowrap}
.pill b{font-size:24px}
.pill.earth b{color:var(--ok)}.pill.ufo b{color:var(--bad)}
#mainBtn{font-size:22px;font-weight:800;padding:12px 26px;border-radius:14px;border:0;cursor:pointer;background:var(--lime);color:#14180a;box-shadow:0 0 24px rgba(232,255,138,.45);transition:opacity .2s,transform .2s}
#mainBtn:hover{transform:scale(1.04)}
#mainBtn:disabled{opacity:0;pointer-events:none}
.hbtn{background:rgba(10,14,40,.55);border:0;color:var(--ink);font-size:15px;padding:9px 13px;border-radius:9px;cursor:pointer;margin-left:6px}

/* ===== UFO ===== */
#ufo,.ufo-extra{position:absolute;width:260px;height:120px;left:calc(50% - 130px);top:80px;z-index:10;transition-property:left,top;transition-timing-function:cubic-bezier(.5,0,.3,1);transition-duration:.6s}
.bob{width:100%;height:100%;position:relative;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.dome{position:absolute;left:75px;top:4px;width:110px;height:78px;border-radius:55px 55px 10px 10px;overflow:hidden;background:radial-gradient(circle at 50% 75%,rgba(70,140,190,.6),rgba(18,36,80,.85))}
.dome .alien{position:absolute;left:27px;top:6px;width:56px;height:56px}
.dome .baby{position:absolute;right:8px;bottom:12px;width:30px;height:30px;transform:translateY(44px);transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.dome.peek .baby{transform:translateY(0)}
.capL,.capR{position:absolute;bottom:15px;display:flex}
.capL{left:3px}.capR{right:3px;flex-direction:row-reverse}
.cap{width:16px;height:21px;margin:0 -4px;animation:bang .45s ease-in-out infinite alternate}
.cap:nth-child(even){animation-delay:.2s}
.cap svg{width:100%;height:100%}
@keyframes bang{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-3px) rotate(6deg)}}
.glass{position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(180,230,255,.6);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.65),rgba(255,255,255,0) 32%);pointer-events:none}
.hull{position:absolute;left:0;top:54px;width:260px;height:66px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.lt{fill:#7ef6ff;animation:ublink 1s infinite}
.lt.b{fill:#ffd36e;animation-delay:.5s}
@keyframes ublink{50%{opacity:.25}}
#ufo.angry .lt,.ufo-extra .lt{fill:var(--bad)}
.pencil{transform-box:fill-box;transform-origin:bottom center;animation:scribble .18s infinite alternate}
@keyframes scribble{to{transform:rotate(30deg) translate(2px,-1px)}}
.shake{animation:shake .12s 6}
@keyframes shake{25%{transform:translate(-6px,2px) rotate(-3deg)}75%{transform:translate(6px,-2px) rotate(3deg)}}

/* tia hút */
#beam{position:absolute;z-index:5;width:190px;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(rgba(225,255,165,.9),rgba(190,255,140,.18));opacity:0;transition:opacity .2s;pointer-events:none}
#beam.on{opacity:1;animation:bflick .12s infinite alternate}
#beam.red{background:linear-gradient(rgba(255,130,150,.95),rgba(255,90,110,.2))}
#beam.gold{background:linear-gradient(rgba(255,236,160,.9),rgba(255,214,120,.1))}
@keyframes bflick{to{filter:brightness(1.35)}}
.zap{position:fixed;height:5px;border-radius:3px;background:linear-gradient(90deg,#fff,#ff5a6e);box-shadow:0 0 12px #ff5a6e;transform-origin:0 50%;z-index:9;pointer-events:none}

/* ===== nhân vật chibi ===== */
#crowd{position:absolute;left:2vw;right:2vw;bottom:1.2vh;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:calc(var(--s)*2px) calc(var(--s)*6px);z-index:6}
.p{width:calc(var(--s)*88px);position:relative}
.mover{display:flex;flex-direction:column;align-items:center;transition:transform .55s cubic-bezier(.3,.7,.4,1)}
.jump{width:calc(var(--s)*80px);height:calc(var(--s)*104px)}
.fig{width:100%;height:100%;overflow:visible;display:block;transition:transform .15s}
.fig.flip{transform:scaleX(-1)}
.fig .armL,.fig .armR,.fig .legL,.fig .legR,.fig .head{transform-box:view-box;transition:transform .25s}
.fig .armL{transform-origin:29px 82px}.fig .armR{transform-origin:71px 82px}
.fig .legL{transform-origin:44px 100px}.fig .legR{transform-origin:56px 100px}
.fig .head{transform-origin:50px 76px}
.fig .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.nm{margin-top:2px;font-size:calc(var(--s)*15px);font-weight:700;text-align:center;line-height:1.15;max-width:100%;background:rgba(5,8,25,.6);padding:2px 7px;border-radius:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lbl{font-size:calc(var(--s)*12px);color:var(--bad);font-weight:700;margin-top:2px;display:none}
/* tư thế */
.p.wave .armR{animation:wave .35s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-125deg)}to{transform:rotate(-165deg)}}
.p.cheer .armL{transform:rotate(155deg)}.p.cheer .armR{transform:rotate(-155deg)}
.p.cover .armL{transform:rotate(140deg)}.p.cover .armR{transform:rotate(-140deg)}
.p.tilt .head{transform:rotate(-12deg)}
.p.run .legL,.p.run .armR{animation:swA .17s infinite alternate}
.p.run .legR,.p.run .armL{animation:swB .17s infinite alternate}
@keyframes swA{from{transform:rotate(30deg)}to{transform:rotate(-30deg)}}
@keyframes swB{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
/* chuyển động cả người (thứ tự quan trọng: sau thắng trước) */
.p.tremble .jump{animation:tremble .08s infinite alternate}
@keyframes tremble{from{transform:translateX(-1.6px)}to{transform:translateX(1.6px)}}
.p.run .jump{animation:runbob .17s infinite alternate}
@keyframes runbob{to{transform:translateY(-6px)}}
.p.bounce .jump{animation:hop .55s infinite;animation-delay:var(--hd,0s)}
.p.hop .jump{animation:hop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{50%{transform:translateY(-22px)}}
/* trạng thái */
.p.target .nm{background:var(--lime);color:#111}
.p.safe .nm{background:rgba(61,220,132,.3);box-shadow:0 0 0 2px var(--ok)}
.p.gone .jump{visibility:hidden}
.p.gone .nm{text-decoration:line-through;opacity:.55}
.p.gone .lbl{display:block}
.p.absent{opacity:.3}
.p.burnt .hairc{fill:#3b3b3b}
.p.burnt .soot{display:inline}
.soot{display:none}

/* ===== bong bóng thoại ===== */
.bubble{position:fixed;z-index:27;max-width:min(380px,80vw);background:#fff;color:#1a1d33;font-size:21px;font-weight:700;line-height:1.3;padding:10px 16px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.45);pointer-events:none;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.bubble::after{content:"";position:absolute;left:var(--tx,50%);bottom:-10px;margin-left:-10px;border:10px solid transparent;border-bottom:0;border-top-color:#fff}
.bubble.down::after{bottom:auto;top:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble.baby{background:#ffe1ef}.bubble.baby::after{border-top-color:#ffe1ef}.bubble.baby.down::after{border-top-color:transparent;border-bottom-color:#ffe1ef}
.bubble.radio{background:#d6f6ff;font-style:italic}.bubble.radio::after{border-top-color:#d6f6ff}.bubble.radio.down::after{border-top-color:transparent;border-bottom-color:#d6f6ff}

/* ===== gia đình UFO (kết cục) ===== */
#family{position:absolute;left:0;right:0;display:none;justify-content:center;align-items:flex-end;gap:18px;z-index:12;pointer-events:none}
#family.show{display:flex}
.fam svg{width:100%;height:100%;overflow:visible}
.fam{animation:fambob 1.4s ease-in-out infinite alternate}
.fam:nth-child(2){animation-delay:.3s}.fam:nth-child(3){animation-delay:.6s}
@keyframes fambob{to{transform:translateY(-6px)}}
.heart{position:fixed;z-index:13;font-size:26px;pointer-events:none;color:#ff6f91}

/* ===== chữ lớn giữa màn hình ===== */
#caption{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:25;text-align:center;pointer-events:none;width:92vw}
#caption h1{font-size:clamp(48px,7.5vw,104px);font-weight:900;text-shadow:0 6px 0 rgba(0,0,0,.45)}
#caption p{font-size:clamp(22px,2.5vw,36px);margin-top:10px;font-weight:700;text-shadow:0 3px 8px rgba(0,0,0,.85)}
.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* ===== thẻ nổi ===== */
#overlay{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(3,5,18,.55)}
#overlay.show{display:flex}
.card{width:min(980px,92vw);max-height:92vh;overflow:auto;background:var(--card);border:2px solid #3a4590;border-radius:22px;padding:30px 40px;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.card.pop{animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.tag{font-family:ui-monospace,Consolas,"Courier New",monospace;color:#9ff79f;letter-spacing:.14em;font-size:16px;font-weight:700}
.to{font-size:24px;color:var(--muted);margin-top:8px}.to b{color:var(--lime)}
.q{font-size:clamp(26px,3vw,42px);font-weight:800;line-height:1.28;margin:16px 0 8px;min-height:1.3em}
.q.sm{font-size:clamp(20px,2vw,28px);color:var(--muted);margin:10px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 4px}
.optb{display:flex;gap:14px;align-items:center;text-align:left;font-size:clamp(19px,1.9vw,27px);font-weight:700;line-height:1.3;padding:12px 16px;border-radius:14px;border:2px solid #3a4590;background:#0a0e28;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,opacity .3s}
.optb .L{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#2a3170;font-weight:900}
.optb:hover:not(:disabled){border-color:var(--lime)}
.optb:disabled{cursor:default}
.optb.right{border-color:var(--ok);background:rgba(61,220,132,.22)}.optb.right .L{background:var(--ok);color:#03210f}
.optb.wrong{border-color:var(--bad);background:rgba(255,90,110,.22)}.optb.wrong .L{background:var(--bad);color:#2a0008}
.opts.done .optb:not(.right):not(.wrong){opacity:.4}
.good{color:var(--ok);font-weight:900}
.hint{font-size:24px;color:#ffd27a;min-height:32px}
.trow{display:flex;align-items:center;gap:16px;margin:16px 0 6px}
.timer{flex:1;height:18px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a6e,#ffd27a 35%,#9ff79f)}
.tnum{font-size:34px;font-weight:900;width:70px;text-align:right}
.tnum.low{color:var(--bad)}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.btn{font-size:20px;font-weight:800;padding:13px 22px;border-radius:12px;border:0;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--ink)}
.btn.main{background:var(--lime);color:#14180a}
.btn small{opacity:.6;font-weight:600}
.ans{font-size:clamp(26px,3vw,40px);font-weight:700;line-height:1.35;margin:14px 0}
.by{font-size:24px;color:var(--muted)}.by b{color:var(--lime)}
h2.big{font-size:clamp(40px,5.5vw,72px);font-weight:900;line-height:1.1;margin:8px 0}
.lead{font-size:24px;color:var(--muted);line-height:1.45}
label{display:block;font-weight:700;font-size:18px;margin:18px 0 8px}
textarea,input[type=number]{width:100%;background:#0a0e28;color:var(--ink);border:1px solid #3a4590;border-radius:10px;padding:12px;font-size:17px;font-family:inherit}
textarea{height:210px;resize:vertical}
input[type=number]{width:110px}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:28px}
.rules{font-size:17px;color:var(--muted);line-height:1.6}
.rules b{color:var(--ink)}
kbd{background:#2a3170;border-radius:5px;padding:1px 7px;font-family:inherit;font-weight:700;color:var(--ink)}
.err{color:var(--bad);font-weight:700;min-height:24px;margin-top:8px}
.puff{position:absolute;border-radius:50%;background:rgba(180,180,190,.7);z-index:11;pointer-events:none}
.conf{position:fixed;width:12px;height:16px;z-index:24;pointer-events:none}
/* trình sửa câu hỏi */
.qed{border:1px solid #3a4590;border-radius:14px;padding:14px 16px;margin:14px 0;background:rgba(255,255,255,.02)}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:19px;margin-bottom:8px}
.qed textarea,.qed input[type=text]{width:100%;height:auto;background:#0a0e28;color:var(--ink);border:1px solid #3a4590;border-radius:9px;padding:9px 11px;font-size:16px;font-family:inherit;resize:vertical}
.qed .sub{font-size:14px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.orow{display:flex;align-items:center;gap:8px;margin:6px 0}
.orow input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex:none;cursor:pointer}
.orow .L{flex:none;width:26px;font-weight:900;text-align:center}
.orow.isright input[type=text]{border-color:var(--ok)}
.mini{background:rgba(255,255,255,.1);border:0;color:var(--ink);font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer;margin-left:4px}
.mini:disabled{opacity:.3;cursor:default}
.mini.del{color:#ffb3bd}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{position:sticky;bottom:-30px;background:var(--card);padding:12px 0 6px;border-top:1px solid #3a4590}
.note{font-size:16px;color:var(--muted);margin-top:6px}
@media(max-width:720px){.opts,.two,.cols{grid-template-columns:1fr}.card{padding:22px 18px}}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div id="bgwrap"></div>

  <div id="hud">
    <div class="score">
      <span class="pill" id="qcount">Câu <b>0</b>/0</span>
      <span class="pill earth">Trái Đất <b id="sRight">0</b></span>
      <span class="pill ufo">UFO <b id="sWrong">0</b></span>
    </div>
    <button id="mainBtn" disabled onclick="hunt()">UFO SĂN MỒI ▶ <small>(Space)</small></button>
    <div>
      <button class="hbtn" id="muteBtn" onclick="toggleMute()">Âm thanh: bật</button>
      <button class="hbtn" onclick="toggleFS()">Toàn màn hình</button>
    </div>
  </div>

  <div id="beam"></div>
  <div id="ufo"><div class="bob">
    <div class="dome" id="dome">
      <svg class="alien" viewBox="0 0 70 70">
        <path d="M25 16 Q21 6 14 4" stroke="#6fdc7a" stroke-width="2.5" fill="none"/><circle cx="14" cy="4" r="3.5" fill="#ffd36e"/>
        <path d="M45 16 Q49 6 56 4" stroke="#6fdc7a" stroke-width="2.5" fill="none"/><circle cx="56" cy="4" r="3.5" fill="#ffd36e"/>
        <ellipse cx="35" cy="68" rx="19" ry="11" fill="#4fbf63"/>
        <ellipse cx="35" cy="35" rx="22" ry="21" fill="#6fdc7a"/>
        <g id="aface"></g>
        <g id="anote" style="display:none">
          <g transform="rotate(-8 31 60)"><rect x="19" y="52" width="24" height="17" rx="2" fill="#fff"/><path d="M22 57 h17 M22 61 h14 M22 65 h10" stroke="#8892b0" stroke-width="1.3"/></g>
          <rect class="pencil" x="44" y="46" width="4" height="17" rx="1" fill="#ffd166"/>
        </g>
      </svg>
      <svg class="baby" viewBox="0 0 40 40">
        <path d="M20 10 V3" stroke="#a6f3ad" stroke-width="2.5"/><path d="M20 5 l-3.5 -3.5 a2.5 2.5 0 0 1 3.5 -1.2 a2.5 2.5 0 0 1 3.5 1.2z" fill="#ff4d6d"/>
        <ellipse cx="20" cy="24" rx="16" ry="15" fill="#a6f3ad"/>
        <ellipse cx="14" cy="23" rx="4" ry="5.5" fill="#0b0f24"/><ellipse cx="26" cy="23" rx="4" ry="5.5" fill="#0b0f24"/>
        <circle cx="15" cy="21" r="1.5" fill="#fff"/><circle cx="27" cy="21" r="1.5" fill="#fff"/>
        <path d="M17 31 Q20 34 23 31" stroke="#0b0f24" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <ellipse cx="8" cy="29" rx="3" ry="2" fill="#ff8fa3" opacity=".7"/><ellipse cx="32" cy="29" rx="3" ry="2" fill="#ff8fa3" opacity=".7"/>
      </svg>
      <div class="capL"></div><div class="capR"></div>
      <div class="glass"></div>
    </div>
    <svg class="hull" viewBox="0 0 260 66">
      <defs><linearGradient id="hullg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2f5fc"/><stop offset=".55" stop-color="#98a2bf"/><stop offset="1" stop-color="#565e7d"/></linearGradient></defs>
      <path d="M92 44 Q130 70 168 44 Z" fill="#454c6b"/>
      <ellipse cx="130" cy="56" rx="17" ry="4.5" fill="#d8ffb0" opacity=".85"/>
      <ellipse cx="130" cy="30" rx="128" ry="22" fill="url(#hullg)"/>
      <ellipse cx="130" cy="22" rx="110" ry="7" fill="#fff" opacity=".35"/>
      <circle class="lt" cx="28" cy="36" r="5.5"/><circle class="lt b" cx="62" cy="40" r="5.5"/><circle class="lt" cx="96" cy="42" r="5.5"/><circle class="lt b" cx="130" cy="43" r="5.5"/><circle class="lt" cx="164" cy="42" r="5.5"/><circle class="lt b" cx="198" cy="40" r="5.5"/><circle class="lt" cx="232" cy="36" r="5.5"/>
    </svg>
  </div></div>

  <div id="family"></div>
  <div id="crowd"></div>
  <div id="caption"></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>

<script>
/* ============ CÂU HỎI MẶC ĐỊNH ============
   Có thể sửa ngay trong game: màn hình đầu → "Sửa câu hỏi".
   q: câu hỏi · options: các phương án (2–6) · correct: số thứ tự phương án đúng, đếm từ 0 (0 = A, 1 = B…)
   hint: gợi ý · explain: giải thích sau khi chấm · by: thành viên phụ trách nói thêm */

/* Chuẩn hóa một bộ câu hỏi (từ bộ nhớ trình duyệt hoặc file nhập). Trả null nếu không dùng được. */
function normalizeQuestions(arr){
  if(!Array.isArray(arr))return null;
  const out=arr.filter(x=>x&&typeof x==="object").map(x=>{
    const options=(Array.isArray(x.options)?x.options:[]).slice(0,MAX_OPTS).map(o=>String(o??""));
    while(options.length<2)options.push("");
    let correct=parseInt(x.correct); if(!(correct>=0&&correct<options.length))correct=0;
    return {q:String(x.q??""),options,correct,hint:String(x.hint??""),explain:String(x.explain??x.a??""),by:String(x.by??"")};
  });
  return out.length?out:null;
}
function loadQuestions(){try{return normalizeQuestions(JSON.parse(localStorage.getItem("ufo_questions")))}catch(e){return null}}
function storeQuestions(qs){try{qs?localStorage.setItem("ufo_questions",JSON.stringify(qs)):localStorage.removeItem("ufo_questions");return true}catch(e){return false}}

function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function looks(name,female){
  const R=rng(hash(name.toLowerCase())), pk=a=>a[Math.floor(R()*a.length)];
  return {female,skin:pk(SKINS),hair:pk(HAIRS),style:female?pk(["long","pony","buns","bob"]):pk(["short","spiky","side","curly"]),
    shirt:pk(COLORS),pants:pk(PANTS),glasses:R()<.25,bow:female&&R()<.5,bowC:pk(BOWS),cap:!female&&R()<.15};
}

let ac=null, muted=false;
function actx(){ if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(ac&&ac.state==="suspended")ac.resume(); return ac; }
function tone(f,d=.15,type="sine",v=.15,f2=null,delay=0){
  if(muted)return; const a=actx(); if(!a)return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+d+.03);
}

/* Mỗi dòng một tên; thêm "(nữ)" sau tên để vẽ nhân vật nữ */
function parseNames(raw){
  return raw.split(/\r?\n/).map(s=>s.normalize("NFC").trim()).filter(Boolean).map(line=>{
    const m=line.match(/^(.*?)\s*[\(\[]\s*(nữ|nu|nam)\s*[\)\]]\s*$/i);
    const name=(m?m[1]:line).trim()||line;
    return {name,female:!!m&&m[2].toLowerCase()!=="nam"};
  });
}

/* ============ điều khiển nhân vật ============ */
function setFace(p,f){if(p.face===f)return;p.face=f;p.faceEl.innerHTML=FACES[f]}
function setPose(p,c){p.el.classList.remove("wave","cheer","cover");if(c)p.el.classList.add(c)}
function homeX(p){const r=p.el.getBoundingClientRect();return r.left+r.width/2}
function moveTo(p,dx,run=true){
  const old=p.dx; p.dx=dx; p.mover.style.transform=dx?`translateX(${dx}px)`:"";
  if(run&&Math.abs(dx-old)>4){
    p.fig.classList.toggle("flip",dx<old); p.el.classList.add("run"); clearTimeout(p.rt);
    p.rt=setTimeout(()=>{p.el.classList.remove("run");p.fig.classList.remove("flip")},560);
  }
}
function claim(p){p.tok++;p.busy=true;return p.tok}
function release(p,t,face="happy"){if(p.tok!==t)return;p.busy=false;setFace(p,face);setPose(p,"");p.el.classList.remove("tremble","bounce","tilt","hop")}
function resetCrowd(){
  people.forEach(p=>{p.tok++;p.busy=false;setFace(p,"happy");setPose(p,"");p.el.classList.remove("bounce","tremble","hop","tilt","target");if(p.dx)moveTo(p,0)});
}
function crowdCheer(ms=2400){
  people.forEach(p=>{if(p.gone)return;const t=claim(p);setFace(p,"cheer");setPose(p,Math.random()<.6?"cheer":"wave");p.el.classList.add("bounce");setTimeout(()=>release(p,t),ms)});
}
function crowdSad(except,ms=3000){
  people.forEach(p=>{if(p.gone||p===except)return;const t=claim(p);setFace(p,Math.random()<.5?"sad":"scared");setPose(p,Math.random()<.5?"wave":"cover");setTimeout(()=>release(p,t),ms)});
}
/* Người ở gần UFO thì bỏ chạy, UFO đi xa thì quay về */
function reactToUfo(cx,except){
  people.forEach(p=>{
    if(p.gone||p===except)return;
    const hx=homeX(p), d=hx-cx;
    if(Math.abs(d)<170){
      claim(p); const dir=d>=0?1:-1;
      const dx=Math.max(24-hx,Math.min(innerWidth-24-hx,dir*(100+Math.random()*70)));
      moveTo(p,dx); setFace(p,Math.random()<.5?"scared":"panic"); setPose(p,Math.random()<.4?"cover":"");
      p.el.classList.remove("tremble");
    }else if(p.busy&&p.dx){
      moveTo(p,0); setFace(p,"scared"); setPose(p,""); p.el.classList.add("tremble");
    }
  });
}
function calmCrowd(t){
  people.forEach(p=>{if(p.gone||p===t)return;const k=claim(p);if(p.dx)moveTo(p,0);setFace(p,"relieved");setPose(p,"");p.el.classList.remove("tremble");setTimeout(()=>release(p,k),1800)});
}
function neighbor(t){
  const r=t.fig.getBoundingClientRect();let best=null,bd=1e9;
  people.forEach(p=>{if(p===t||p.gone||p.absent)return;const q=p.el.getBoundingClientRect(),d=Math.hypot(q.left-r.left,(q.top-r.top)*1.6);if(d<bd){bd=d;best=p}});
  return best;
}
/* Hoạt động lúc chờ: nhún, vẫy tay, nghiêng đầu, ngó nghiêng */
setInterval(()=>{
  if(!people.length||document.hidden||state==="setup"||state==="edit")return;
  if(state==="question"&&Math.random()<.5)return;
  const free=people.filter(p=>!p.gone&&!p.busy&&p!==current&&p.face==="happy");
  if(!free.length)return;
  const p=pick(free), t=claim(p), act=pick(["hop","wave","tilt","look","hop","wave","cheer"]);
  if(act==="hop"){p.el.classList.add("hop");setTimeout(()=>release(p,t),480)}
  else if(act==="wave"){setPose(p,"wave");setFace(p,"cheer");setTimeout(()=>release(p,t),1400)}
  else if(act==="cheer"){setPose(p,"cheer");p.el.classList.add("hop");setFace(p,"cheer");setTimeout(()=>release(p,t),700)}
  else if(act==="tilt"){p.el.classList.add("tilt");setTimeout(()=>release(p,t),1100)}
  else {p.fig.classList.add("flip");setTimeout(()=>{p.fig.classList.remove("flip");release(p,t)},900)}
},550);

async function twistFakeout(t){

  fam.innerHTML=`<div class="fam" data-k="dad" style="width:96px;height:132px">${famSVG("dad")}</div><div class="fam" data-k="baby" style="width:62px;height:85px">${famSVG("baby")}</div><div class="fam" data-k="mom" style="width:92px;height:126px">${famSVG("mom")}</div>`;
  fam.classList.add("show"); peekBaby(false);
  [...fam.children].forEach((f,i)=>f.animate([{transform:"translateY(-140px) scale(.2)",opacity:0},{transform:"none",opacity:1}],{duration:900,delay:i*200,easing:"cubic-bezier(.3,1.3,.5,1)"}));
  await wait(1400);
  for(const [k,t] of lines){await say(fam.querySelector(`[data-k="${k}"]`),t,k==="baby"?"baby":"")}
}
async function ending(){
  state="end"; $("#mainBtn").disabled=true; updateScore(); resetCrowd(); clearBubbles(); peekBaby(false);
  const total=QUESTIONS.length, win=right*2>total;
  homeUfo(900); await wait(1000);
  if(win){
    setAlien("shock"); caption("…","UFO: “Loài người hiểu bài quá…”","var(--lime)");
    ufo.firstElementChild.classList.add("shake");
    for(let i=0;i<10;i++){puff();await wait(140)}
    ufo.firstElementChild.classList.remove("shake"); await wait(600);
    await revealFamily(TWIST_WIN);
    // thả những người bị bắt về
    clearCaptives();
    people.filter(p=>p.gone).forEach((p,i)=>{
      p.gone=false;p.el.classList.remove("gone");
      p.fig.animate([{transform:"translateY(-60vh) scale(.2)",opacity:0},{transform:"translateY(0) scale(1)",opacity:1}],{duration:900,delay:i*120,easing:"cubic-bezier(.3,1.4,.5,1)"});
    });
    setAlien("love"); hearts(); await wait(900); crowdCheer(4000); sfx.win();
    await wait(1200);
    [...fam.children].forEach((f,i)=>f.animate([{transform:"none",opacity:1},{transform:"translateY(-160px) scale(.2)",opacity:0}],{duration:700,delay:i*150,fill:"forwards"}));
    await wait(1000); fam.classList.remove("show"); beamOff();
    await ufo.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate(-30px,20px) scale(1.05)",offset:.2},{transform:`translate(${innerWidth*.6}px,-${innerHeight*.5}px) scale(.08)`,opacity:.2}],{duration:1900,easing:"cubic-bezier(.6,0,.9,.6)"}).finished;
    ufo.style.display="none"; cap.innerHTML="";
    endCard("TRÁI ĐẤT AN TOÀN!",`Đúng ${right}/${total} câu. Plot twist: UFO hóa ra là một gia đình đi lạc, tới Trái Đất để học cách xây dựng gia đình hạnh phúc. Ai bị bắt đã được thả về!`,"var(--ok)");
  }else{
    setAlien("laugh"); caption("HA HA HA!","UFO: “Trái Đất là của chúng ta!”","var(--bad)");
    stage.classList.add("doom"); sfx.lose();
    people.forEach(p=>{if(p.gone)return;claim(p);setFace(p,"panic");setPose(p,"cover");const hx=homeX(p);moveTo(p,Math.max(24-hx,Math.min(innerWidth-24-hx,(Math.random()*2-1)*140)))});
    for(let i=0;i<6;i++){
      const c=ufo.cloneNode(true); c.removeAttribute("id"); c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
      c.querySelectorAll(".capL,.capR").forEach(e=>e.innerHTML=""); c.className="ufo-extra";
      c.style.cssText=`left:${Math.random()*(innerWidth-260)}px;top:${80+Math.random()*innerHeight*.25}px;transform:scale(${(.4+Math.random()*.4).toFixed(2)})`;
      stage.appendChild(c);
      c.animate([{translate:"0 -60vh",opacity:0},{translate:"0 0",opacity:1}],{duration:900,easing:"ease-out"});
      await wait(250);
    }
    await wait(1500); cap.innerHTML="";
    resetCrowd();
    document.querySelectorAll(".ufo-extra").forEach(e=>e.animate([{opacity:1},{opacity:0}],{duration:800,fill:"forwards"}).finished.then(()=>e.remove()));
    stage.classList.remove("doom");
    await revealFamily(TWIST_LOSE);
    setAlien("laugh");
    const rest=people.filter(p=>!p.gone);
    for(let i=0;i<rest.length;i+=6){rest.slice(i,i+6).forEach(p=>{setFace(p,"surprised");abduct(p)});sfx.zap();await wait(450)}
    await wait(2000); gulp(); hearts(8);
    endCard("CẢ LỚP BỊ MỜI LÊN TÀU ÔN BÀI",`Chỉ đúng ${right}/${total} câu. Plot twist: UFO là một gia đình đi lạc, đang tìm cách xây dựng gia đình hạnh phúc… và giờ cả lớp phải lên tàu ôn lại Chương 7 cùng nhà họ!`,"var(--bad)");
  }
}
function endCard(title,text,color){
  card.className="card pop";
  card.innerHTML=`<div class="tag">▌KẾT CỤC</div><h2 class="big" style="color:${color}">${esc(title)}</h2><div class="lead">${esc(text)}</div>
    <div class="btns"><button class="btn ghost" onclick="showSetup()">Chơi lại</button></div>`;
  overlay.classList.add("show");
}

/* ============ trình sửa câu hỏi ============ */
let draft=null;
function openEditor(){
  readSetup();
  draft=clone(QUESTIONS); state="edit"; renderEditor(); card.scrollTop=0;
}
function renderEditor(){
  const y=card.scrollTop;
  card.className="card";
  card.innerHTML=`
    <div class="tag">▌BỘ CÂU HỎI TRẮC NGHIỆM</div>
    <h2 class="big" style="font-size:clamp(30px,3.6vw,46px)">Sửa câu hỏi</h2>
    <div class="note">Bấm vào ô tròn cạnh phương án đúng. Câu hỏi được lưu trong trình duyệt của máy này. Muốn dùng trên máy khác thì bấm <b>Xuất file</b>, rồi bên máy kia bấm <b>Nhập file</b>.</div>
    ${draft.map(qBlock).join("")}
    <div class="btns"><button class="btn ghost" onclick="edAdd()">+ Thêm câu hỏi</button></div>
    <div class="bar">
      <div class="err" id="err" style="margin:0 0 6px"></div>
      <div class="btns" style="margin:0">
        <button class="btn main" onclick="edSave()">Lưu và quay lại</button>
        <button class="btn ghost" onclick="edCancel()">Hủy</button>
        <button class="btn ghost" onclick="edExport()">Xuất file</button>
        <button class="btn ghost" onclick="$('#impFile').click()">Nhập file</button>
        <button class="btn ghost" onclick="edReset()">Khôi phục mặc định</button>
        <input type="file" id="impFile" accept=".json,application/json" style="display:none" onchange="edImport(this)">
      </div>
    </div>`;
  overlay.classList.add("show");
  card.scrollTop=y;
}
function qBlock(q,i){
  const opts=q.options.map((o,j)=>`
    <div class="orow${j===q.correct?" isright":""}">
      <input type="radio" name="c${i}" title="Đáp án đúng" ${j===q.correct?"checked":""} onchange="edCorrect(${i},${j})">
      <span class="L">${LETTERS[j]}</span>
      <input type="text" value="${esc(o)}" placeholder="Phương án ${LETTERS[j]}" oninput="draft[${i}].options[${j}]=this.value">
      <button class="mini del" title="Xóa phương án" onclick="edDelOpt(${i},${j})" ${q.options.length<=2?"disabled":""}>✕</button>
    </div>`).join("");
  return `<div class="qed">
    <div class="qhead"><b>Câu ${i+1}</b><span>
      <button class="mini" title="Đưa lên" onclick="edMove(${i},-1)" ${i===0?"disabled":""}>↑</button>
      <button class="mini" title="Đưa xuống" onclick="edMove(${i},1)" ${i===draft.length-1?"disabled":""}>↓</button>
      <button class="mini del" onclick="edDel(${i})" ${draft.length<=1?"disabled":""}>Xóa câu</button></span></div>
    <textarea rows="2" placeholder="Nội dung câu hỏi" oninput="draft[${i}].q=this.value">${esc(q.q)}</textarea>
    <div class="sub">Phương án (chọn ô tròn ở phương án đúng)</div>
    ${opts}
    ${q.options.length<MAX_OPTS?`<button class="mini" style="margin:4px 0 0 34px" onclick="edAddOpt(${i})">+ Thêm phương án</button>`:""}
    <div class="two">
      <div><div class="sub">Gợi ý (không bắt buộc)</div><input type="text" value="${esc(q.hint)}" oninput="draft[${i}].hint=this.value"></div>
      <div><div class="sub">Người nói thêm (không bắt buộc)</div><input type="text" value="${esc(q.by)}" oninput="draft[${i}].by=this.value"></div>
    </div>
    <div class="sub">Giải thích hiện sau khi chấm (không bắt buộc)</div>
    <textarea rows="2" oninput="draft[${i}].explain=this.value">${esc(q.explain)}</textarea>
  </div>`;
}
function edCorrect(i,j){draft[i].correct=j;renderEditor()}
function edAddOpt(i){if(draft[i].options.length<MAX_OPTS){draft[i].options.push("");renderEditor()}}
function edDelOpt(i,j){
  const q=draft[i]; if(q.options.length<=2)return;
  q.options.splice(j,1);
  if(q.correct===j)q.correct=0; else if(q.correct>j)q.correct--;
  renderEditor();
}
function edAdd(){
  draft.push({q:"",options:["","","",""],correct:0,hint:"",explain:"",by:""});
  renderEditor(); card.scrollTop=card.scrollHeight;
}
function edDel(i){
  if(draft.length<=1)return;
  if(!confirm(`Xóa câu ${i+1}?`))return;
  draft.splice(i,1); renderEditor();
}
function edMove(i,d){
  const k=i+d; if(k<0||k>=draft.length)return;
  [draft[i],draft[k]]=[draft[k],draft[i]]; renderEditor();
}
/* Kiểm tra và làm gọn: bỏ phương án trống, giữ đúng phương án được chọn */
function edValidate(){
  const out=[];
  for(let i=0;i<draft.length;i++){
    const d=draft[i], n=`Câu ${i+1}`;
    if(!d.q.trim())return {err:`${n}: chưa có nội dung câu hỏi.`};
    if(!(d.options[d.correct]||"").trim())return {err:`${n}: phương án đúng (${LETTERS[d.correct]}) đang để trống.`};
    const options=[]; let correct=0;
    d.options.forEach((o,j)=>{if(o.trim()){if(j===d.correct)correct=options.length;options.push(o.trim())}});
    if(options.length<2)return {err:`${n}: cần ít nhất 2 phương án có nội dung.`};
    out.push({q:d.q.trim(),options,correct,hint:d.hint.trim(),explain:d.explain.trim(),by:d.by.trim()});
  }
  return {qs:out};
}
function edSave(){
  const r=edValidate(); if(r.err){$("#err").textContent=r.err;return}
  QUESTIONS=r.qs;
  const isDefault=JSON.stringify(QUESTIONS)===JSON.stringify(DEFAULT_QUESTIONS);
  if(!storeQuestions(isDefault?null:QUESTIONS)){alert("Trình duyệt không cho lưu. Câu hỏi chỉ dùng được đến khi tải lại trang; hãy Xuất file để giữ lại.")}
  draft=null; showSetup();
}
function edCancel(){
  if(JSON.stringify(draft)!==JSON.stringify(QUESTIONS)&&!confirm("Bỏ các thay đổi chưa lưu?"))return;
  draft=null; showSetup();
}
function edReset(){
  if(!confirm("Thay toàn bộ câu hỏi bằng bộ mặc định? Bấm Lưu thì mới áp dụng."))return;
  draft=clone(DEFAULT_QUESTIONS); renderEditor(); card.scrollTop=0;
}
function edExport(){
  const blob=new Blob([JSON.stringify(draft,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="cau-hoi-ufo.json";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function edImport(inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  f.text().then(t=>{
    let qs=null; try{qs=normalizeQuestions(JSON.parse(t))}catch(e){}
    if(!qs){$("#err").textContent="File không đúng định dạng câu hỏi.";return}
    draft=qs; renderEditor(); card.scrollTop=0;
    $("#err").textContent=`Đã nhập ${qs.length} câu. Bấm Lưu để áp dụng.`;
  });
  inp.value="";
}
/* ============ phím tắt ============ */
document.addEventListener("keydown",e=>{
  if(state==="setup"||state==="edit")return;
  const k=e.code;
  if(k==="Space"){e.preventDefault(); if(state==="idle")hunt(); else if(state==="answer")nextQ(); return}
  if(state!=="question")return;
  let m=k.match(/^(?:Digit|Numpad)([1-6])$/); if(m){choose(+m[1]-1);return}
  m=k.match(/^Key([A-F])$/); if(m){choose(LETTERS.indexOf(m[1]));return}
  if(k==="KeyG")showHint(); else if(k==="KeyP")togglePause(); else if(k==="KeyR")reroll();
});
addEventListener("resize",()=>{if(state==="idle")homeUfo(0)});
setAlien("smirk"); homeUfo(0); showSetup();
</script>
</body>
